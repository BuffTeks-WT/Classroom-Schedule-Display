<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WTAMU Classroom Schedule System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="Images/icon.png">
    <script src="services/api.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body class="home-page">
    <div class="home-wrapper">
        <div class="home-card">
            <img class="home-seal" src="Images/West_Texas_A&M_University_seal.svg.png" alt="WTAMU Seal">
            <h1 class="home-title">Welcome to the WTAMU Classroom Schedule System</h1>
            <p class="home-subtitle">Schedule rooms and view active campus reservations instantly.</p>
            <div class="home-actions">
                <button class="home-btn primary" onclick="makeAReservation()">Schedule a Reservation</button>
                <button class="home-btn secondary" onclick="viewSchedule()">View Reservations Dashboard</button>
            </div>
        </div>
    </div>
</body>
</html>
